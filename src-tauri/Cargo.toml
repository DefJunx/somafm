[package]
name = "somafm"
version = "0.4.3"
license = "MIT"
description = "Desktop radio player"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "somafm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
rustfft = "6"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# Default `use_dbus` feature: needs libdbus-1 (dev headers) on Linux, but reports a
# missing session bus as an Error; `use_zbus` would panic its service thread instead.
souvlaki = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
