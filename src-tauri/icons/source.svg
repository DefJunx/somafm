<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="band" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" fill-opacity="0.03"/>
    </pattern>
    <filter id="bloom" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComponentTransfer in="b" result="g"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="988" height="988" rx="150" fill="#16171a"/>
  <rect x="18" y="18" width="988" height="988" rx="150" fill="url(#band)"/>
  <rect x="183" y="318" width="370" height="17" fill="#8b5cff"/>
  <rect x="183" y="397" width="370" height="17" fill="#5b6cff"/>
  <rect x="183" y="480" width="765" height="30" fill="#33c6ff" filter="url(#bloom)"/>
  <rect x="183" y="574" width="370" height="17" fill="#7dff5a"/>
  <rect x="183" y="652" width="370" height="17" fill="#ff7a2a"/>
  <rect x="183" y="731" width="370" height="17" fill="#ff3b3b"/>
</svg>
